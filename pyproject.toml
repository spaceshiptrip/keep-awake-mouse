[project]
name = "keep-awake-mouse"
version = "0.2.1"
description = "Tiny Python app that jiggles the mouse to keep the computer awake."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
mouse-mover = "mouse_mover:main"
url-hitter = "url_hitter:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["mouse_mover", "url_hitter"]

